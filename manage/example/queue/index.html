<html>
<head>
<meta charset="utf-8">
<title>Upload Queue</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; background: var(--surface-page); }
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Button, IconButton, Badge, ProgressBar, SearchInput, ContextMenu, SidebarIcon } = window.QueueDesignSystem_e470d5;

const Icon = {
  cloud: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.5 19H9a5 5 0 01-1-9.9A6 6 0 0119 8.1 4 4 0 0117.5 19z"/></svg>),
  film: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>),
  gear: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>),
  users: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>),
  chart: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>),
  dots: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>),
  pin: () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2l1.5 5.5L19 9l-4.5 3L16 18l-4-3-4 3 1.5-6L5 9l5.5-1.5z"/></svg>),
  eye: () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>),
  eyeOff: () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21 21 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21 21 0 01-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 11-4.24-4.24"/></svg>),
  trash: () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>),
  pinFilled: () => (<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 5.5L19 9l-4.5 3L16 18l-4-3-4 3 1.5-6L5 9l5.5-1.5z"/></svg>),
};

const INITIAL = [
  { id: 1, title: "Quarterly product recap.mp4", desc: "Full walkthrough of Q3 feature launches for the all-hands.", time: "Tue, Feb 14 · 10:06 AM", status: "complete", progress: 100, pub: true, pinned: true },
  { id: 2, title: "Onboarding_v3_final_FINAL.mov", desc: "Updated onboarding flow narration, replaces v2.", time: "Tue, Feb 14 · 10:04 AM", status: "uploading", progress: 62, pub: false, pinned: false },
  { id: 3, title: "Customer interview — Acme Co.mp4", desc: "Raw footage, unedited. Needs captions before publishing.", time: "Tue, Feb 14 · 09:51 AM", status: "processing", progress: 100, pub: false, pinned: false },
  { id: 4, title: "Design crit — homepage v2.mp4", desc: "Weekly design review recording.", time: "Mon, Feb 13 · 4:30 PM", status: "failed", progress: 28, pub: false, pinned: false },
  { id: 5, title: "Team standup — Feb 12.mp4", desc: "Daily sync, engineering + product.", time: "Mon, Feb 13 · 9:02 AM", status: "canceled", progress: 12, pub: false, pinned: false },
];

function Row({ item, onMenu, menuOpenId, onSelect }) {
  const open = menuOpenId === item.id;
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: "var(--space-4)",
      padding: "var(--space-3) var(--space-4)",
      background: "var(--surface-card)",
      borderBottom: "1px solid var(--border-subtle)",
    }}>
      <div style={{
        width: 88, height: 52, borderRadius: "var(--radius-sm)", flexShrink: 0,
        background: "var(--gray-100)", display: "flex", alignItems: "center", justifyContent: "center",
        color: "var(--gray-400)",
      }}><Icon.film /></div>

      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {item.pinned && <span style={{ color: "var(--accent)" }}><Icon.pinFilled /></span>}
          <div style={{ fontSize: "var(--text-body-lg)", fontWeight: 600, color: "var(--text-primary)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.title}</div>
        </div>
        <div style={{ fontSize: "var(--text-small)", color: "var(--text-secondary)", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.desc}</div>
        {item.status === "uploading" && (
          <div style={{ marginTop: 8, width: 260 }}><ProgressBar value={item.progress} /></div>
        )}
      </div>

      <div style={{ width: 150, fontSize: "var(--text-small)", color: "var(--text-tertiary)", flexShrink: 0 }}>{item.time}</div>

      <div style={{ width: 130, flexShrink: 0 }}>
        <Badge status={item.status}>{item.status === "uploading" ? `Uploading ${item.progress}%` : undefined}</Badge>
      </div>

      <div style={{ width: 80, flexShrink: 0, fontSize: "var(--text-caption)", color: "var(--text-tertiary)", display: "flex", alignItems: "center", gap: 4 }}>
        {item.pub ? <Icon.eye /> : <Icon.eyeOff />} {item.pub ? "Public" : "Private"}
      </div>

      <div style={{ position: "relative", flexShrink: 0 }}>
        <IconButton icon={<Icon.dots />} label="More actions" active={open} onClick={() => onMenu(open ? null : item.id)} />
        <ContextMenu
          open={open}
          onClose={() => onMenu(null)}
          anchorStyle={{ top: 38, right: 0 }}
          items={[
            { key: "pin", label: item.pinned ? "Unpin" : "Pin", icon: <Icon.pin />, onSelect: () => onSelect(item.id, "pin") },
            { key: "vis", label: item.pub ? "Make private" : "Make public", icon: item.pub ? <Icon.eyeOff /> : <Icon.eye />, onSelect: () => onSelect(item.id, "vis") },
            { key: "delete", label: "Delete", icon: <Icon.trash />, danger: true, onSelect: () => onSelect(item.id, "delete") },
          ]}
        />
      </div>
    </div>
  );
}

function App() {
  const [items, setItems] = React.useState(INITIAL);
  const [menuOpenId, setMenuOpenId] = React.useState(null);
  const [query, setQuery] = React.useState("");

  const handleSelect = (id, action) => {
    if (action === "delete") {
      setItems(items.filter(i => i.id !== id));
      return;
    }
    setItems(items.map(i => {
      if (i.id !== id) return i;
      if (action === "pin") return { ...i, pinned: !i.pinned };
      if (action === "vis") return { ...i, pub: !i.pub };
      return i;
    }));
  };

  const sorted = [...items]
    .filter(i => i.title.toLowerCase().includes(query.toLowerCase()))
    .sort((a, b) => (b.pinned - a.pinned));

  return (
    <div style={{ display: "flex", height: "100vh", fontFamily: "var(--font-sans)" }}>
      <div style={{ width: 56, background: "var(--surface-sidebar)", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, paddingTop: 16, flexShrink: 0 }}>
        <SidebarIcon icon={<Icon.cloud />} label="Uploads" active />
        <SidebarIcon icon={<Icon.film />} label="Library" />
        <SidebarIcon icon={<Icon.chart />} label="Analytics" />
        <SidebarIcon icon={<Icon.users />} label="Team" />
        <div style={{ flex: 1 }} />
        <SidebarIcon icon={<Icon.gear />} label="Settings" />
        <div style={{ height: 16 }} />
      </div>

      <div style={{ flex: 1, overflow: "auto", background: "var(--surface-page)" }}>
        <div style={{ padding: "var(--space-6) var(--space-6) var(--space-4)" }}>
          <div style={{ fontSize: "var(--text-display)", fontWeight: 700 }}>Upload Queue</div>
          <div style={{ fontSize: "var(--text-body)", color: "var(--text-secondary)", marginTop: 4 }}>
            Videos you upload here become visible per their privacy setting — double-check before making one public.
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 var(--space-6) var(--space-4)" }}>
          <SearchInput placeholder="Search videos…" value={query} onChange={e => setQuery(e.target.value)} />
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: "var(--text-small)", color: "var(--text-tertiary)" }}>{items.length} / 12 videos</span>
            <Button variant="primary" disabled={items.length >= 12}>+ Add Videos</Button>
          </div>
        </div>

        <div style={{ margin: "0 var(--space-6)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)", overflow: "hidden", boxShadow: "var(--shadow-xs)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "var(--space-4)", padding: "var(--space-2) var(--space-4)", background: "var(--surface-sunken)", fontSize: "var(--text-caption)", fontWeight: 600, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            <div style={{ width: 88, flexShrink: 0 }}>Thumbnail</div>
            <div style={{ flex: 1 }}>Title / description</div>
            <div style={{ width: 150, flexShrink: 0 }}>Upload time</div>
            <div style={{ width: 130, flexShrink: 0 }}>Status</div>
            <div style={{ width: 80, flexShrink: 0 }}>Visibility</div>
            <div style={{ width: 32, flexShrink: 0 }}></div>
          </div>
          {sorted.map(item => (
            <Row key={item.id} item={item} menuOpenId={menuOpenId} onMenu={setMenuOpenId} onSelect={handleSelect} />
          ))}
          {sorted.length === 0 && (
            <div style={{ padding: "var(--space-8)", textAlign: "center", color: "var(--text-tertiary)" }}>No videos match "{query}".</div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
